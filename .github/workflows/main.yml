name: Compilar APK GymTracker

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Descargar y preparar entorno Android
      run: |
        # Descargar un wrapper de gradle funcional
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradlew
        chmod +x gradlew
        mkdir -p gradle/wrapper
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.properties -O gradle/wrapper/gradle-wrapper.properties
        
    - name: Compilar el APK
      run: ./gradlew assembleDebug

    - name: Subir el APK
      uses: actions/upload-artifact@v4
      with:
        name: GymTracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
